name: Animation & a11y regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Unit tests
        run: bun run test

      - name: Setup Environment
        run: cp .env.example .env

      - name: Animation + a11y regression (desktop + mobile)
        run: bunx playwright test --project=desktop-chromium --project=mobile-chromium
        env:
          CI: "true"

      - name: Reduced-motion + keyboard a11y (strict axe gate)
        run: bunx playwright test --project=reduced-motion
        env:
          CI: "true"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload axe-core per-route reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-reports
          path: test-results/axe-reports
          retention-days: 30

      - name: Publish axe summary to job log
        if: always()
        run: |
          if [ -f test-results/axe-reports/summary.md ]; then
            {
              echo "## axe-core per-route summary";
              cat test-results/axe-reports/summary.md;
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-diffs
          path: test-results
          retention-days: 14
