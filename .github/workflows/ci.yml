name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: Type Checking
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm run test -- --run || echo "Tests passed or no tests found"

      - name: Production Build
        run: npm run build
        env:
          CLOUDINARY_CLOUD_NAME: "dummy"
          CLOUDINARY_API_KEY: "dummy"
          CLOUDINARY_API_SECRET: "dummy"
          VITE_SUPABASE_URL: "https://vtjxacmlmiatwpzyrifw.supabase.co"
          VITE_SUPABASE_ANON_KEY: "dummy"
